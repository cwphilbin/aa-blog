# Netlify build config for the Astro static site.
# The SEO pages are 100% prerendered HTML — no functions, no runtime.
#
# DEPLOYMENT MODEL: path-based on the apex. These pages must be SERVED at
# agentsautomated.com/market/*, but agentsautomated.com already runs the main
# app. So this is a standalone Netlify site whose output is mounted at /market/*
# by the apex's edge (rewrite/proxy). See README "Deployment". Everything this
# site emits lives under /market/* by design.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  AWS_REGION = "us-east-2"
  # Canonical origin. Pages resolve to agentsautomated.com/market/{zip}.
  # SITE_URL = "https://agentsautomated.com"

# Long-cache the fingerprinted assets Astro emits under /_astro/.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
